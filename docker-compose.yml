# Hivequill — Vite React PWA. Deps stay in a named Docker volume (not on the host).
#
#   docker compose up --build
#   open http://localhost:5188
#
# Tests:
#   docker compose run --rm app npm run test:coverage
#   docker compose run --rm e2e npm run test:e2e
#
# Port 5188 avoids clashing with other Vite apps commonly bound to 5173/5174.
services:
  app:
    build: .
    ports:
      - "5188:5188"
    volumes:
      - .:/app
      - hivequill_node_modules:/app/node_modules
    command:
      [
        "sh",
        "-c",
        "npm install && npm run dev -- --host 0.0.0.0 --port 5188",
      ]

  e2e:
    image: mcr.microsoft.com/playwright:v1.50.1-jammy
    working_dir: /app
    volumes:
      - .:/app
      - hivequill_node_modules:/app/node_modules
    environment:
      - CI=1
    # Install deps if volume empty, then build+preview via playwright webServer
    entrypoint: ["sh", "-c"]
    command:
      - npm install && npx playwright@1.50.1 test
    profiles:
      - e2e

volumes:
  hivequill_node_modules:
